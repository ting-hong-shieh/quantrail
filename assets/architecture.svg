<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"
     aria-label="QuantRail architecture: your data flows through data governance and the engine into a result with a trust report; accounting and market modules support the engine; research and statistics provide auxiliary tools for recording trials and analysing results; core types underlie everything">
  <title>QuantRail architecture</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0F2A2E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#14B8A6" stroke-opacity="0.06"/>
    </pattern>
    <radialGradient id="halo"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="headlit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5EEAD4"/></marker>
    <style>
      .t { font: 700 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .s { font: 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #94A3B8; }
      .c { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F8FAFC; }
      .h { font: 800 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5EEAD4; letter-spacing: 3px; }
      .lit { opacity: 0; animation: lit 5.0s ease-out infinite; }
      .packet { animation: ride 5.0s cubic-bezier(.5,0,.5,1) infinite; }
      @keyframes lit { 0% { opacity: 0; } 4% { opacity: 1; } 30% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes ride { 0% { transform: translateX(0); opacity: 0; } 4% { opacity: 1; }
        62% { transform: translateX(724px); opacity: 1; }
        70%, 100% { transform: translateX(724px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .lit, .packet { animation: none; } .packet { opacity: 0; } }
    </style>
  </defs>
  <rect width="960" height="470" rx="18" fill="url(#bg)"/>
  <rect width="960" height="470" rx="18" fill="url(#grid)"/>
  <text class="h" x="28" y="50">QUANTRAIL · ARCHITECTURE</text>
  <g class="packet"><circle cx="108.0" cy="131.0" r="17" fill="url(#halo)"/>
    <circle cx="108.0" cy="131.0" r="6.5" fill="#FDE68A"/></g>
  <g>
    <rect x="24" y="92" width="168" height="78" rx="12" fill="#020617" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"/>
    
    <text class="t" x="108.0" y="121" text-anchor="middle" fill="#94A3B8">your data</text>
    <text class="s" x="108.0" y="142" text-anchor="middle">CSV · Parquet · adapters</text>
  </g>
  <g stroke="#334155" stroke-width="2.5"><line x1="198" y1="124.0" x2="198" y2="138.0"/><line x1="206" y1="124.0" x2="206" y2="138.0"/><line x1="214" y1="124.0" x2="214" y2="138.0"/><line x1="222" y1="124.0" x2="222" y2="138.0"/><line x1="230" y1="124.0" x2="230" y2="138.0"/></g>
  <g stroke="#94A3B8" stroke-width="2"><line x1="192" y1="127.0" x2="234" y2="127.0"/>
