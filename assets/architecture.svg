  <line x1="673" y1="228" x2="625" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#head)"/>
  <line class="lit" style="animation-delay:1.73s" x1="673" y1="228" x2="625" y2="176"
        stroke="#5EEAD4" stroke-width="3" marker-end="url(#headlit)"/>
  <g>
    <rect x="786" y="228" width="150" height="78" rx="12" fill="#0B1F24" stroke="#99F6E4" stroke-width="1.5"/>
    <rect class="lit" style="animation-delay:3.00s" x="786" y="228" width="150" height="78" rx="12" fill="#99F6E4" fill-opacity="0.16" stroke="#99F6E4" stroke-width="3"/>
    <text class="t" x="861.0" y="257" text-anchor="middle" fill="#99F6E4">research</text>
    <text class="s" x="861.0" y="278" text-anchor="middle">trial registry</text><text class="s" x="861.0" y="295" text-anchor="middle">auxiliary tool</text>
  </g>
  <g>
    <rect x="786" y="332" width="150" height="78" rx="12" fill="#0B1F24" stroke="#99F6E4" stroke-width="1.5"/>
    <rect class="lit" style="animation-delay:3.00s" x="786" y="332" width="150" height="78" rx="12" fill="#99F6E4" fill-opacity="0.16" stroke="#99F6E4" stroke-width="3"/>
    <text class="t" x="861.0" y="361" text-anchor="middle" fill="#99F6E4">stats</text>
    <text class="s" x="861.0" y="382" text-anchor="middle">metrics · bootstrap</text><text class="s" x="861.0" y="399" text-anchor="middle">Holm · DSR · PBO</text>
  </g>
  <line x1="861" y1="228" x2="861" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#head)"/>
  <line class="lit" style="animation-delay:3.00s" x1="861" y1="228" x2="861" y2="176"
