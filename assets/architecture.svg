  <line x1="861" y1="332" x2="861" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#head)"/>
  <line class="lit" style="animation-delay:3.00s" x1="861" y1="332" x2="861" y2="312"
        stroke="#5EEAD4" stroke-width="3" marker-end="url(#headlit)"/>
  <rect x="24" y="404" width="742" height="42" rx="12" fill="#0B2F2C" stroke="#134E4A"/>
  <text class="t" x="44" y="431" fill="#5EEAD4">core</text>
  <text class="s" x="96" y="431">instruments · Decimal quantities · money per currency · provenance · trust flags</text>
