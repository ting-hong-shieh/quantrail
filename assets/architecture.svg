    <text class="t" x="334.0" y="121" text-anchor="middle" fill="#2DD4BF">data</text>
    <text class="s" x="334.0" y="142" text-anchor="middle">ingest · versions · manifests</text><text class="s" x="334.0" y="159" text-anchor="middle">provenance · trust flags</text>
  </g>
  <g stroke="#334155" stroke-width="2.5"><line x1="440" y1="124.0" x2="440" y2="138.0"/><line x1="448" y1="124.0" x2="448" y2="138.0"/><line x1="456" y1="124.0" x2="456" y2="138.0"/><line x1="464" y1="124.0" x2="464" y2="138.0"/><line x1="472" y1="124.0" x2="472" y2="138.0"/></g>
  <g stroke="#94A3B8" stroke-width="2"><line x1="434" y1="127.0" x2="476" y2="127.0"/>
    <line x1="434" y1="135.0" x2="476" y2="135.0"/></g>
  <g>
    <rect x="476" y="92" width="210" height="78" rx="12" fill="#0B1F24" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect class="lit" style="animation-delay:1.88s" x="476" y="92" width="210" height="78" rx="12" fill="#2DD4BF" fill-opacity="0.16" stroke="#2DD4BF" stroke-width="3"/>
    <text class="t" x="581.0" y="121" text-anchor="middle" fill="#2DD4BF">engine</text>
    <text class="s" x="581.0" y="142" text-anchor="middle">decisions → orders → fills</text><text class="s" x="581.0" y="159" text-anchor="middle">daily NAV identity</text>
  </g>
  <g stroke="#334155" stroke-width="2.5"><line x1="692" y1="124.0" x2="692" y2="138.0"/><line x1="700" y1="124.0" x2="700" y2="138.0"/><line x1="708" y1="124.0" x2="708" y2="138.0"/><line x1="716" y1="124.0" x2="716" y2="138.0"/><line x1="724" y1="124.0" x2="724" y2="138.0"/></g>
  <g stroke="#94A3B8" stroke-width="2"><line x1="686" y1="127.0" x2="728" y2="127.0"/>
    <line x1="686" y1="135.0" x2="728" y2="135.0"/></g>
  <g>
    <rect x="728" y="92" width="208" height="78" rx="12" fill="#0B1F24" stroke="#F59E0B" stroke-width="1.5"/>
    <rect class="lit" style="animation-delay:2.95s" x="728" y="92" width="208" height="78" rx="12" fill="#F59E0B" fill-opacity="0.16" stroke="#F59E0B" stroke-width="3"/>
    <text class="t" x="832.0" y="121" text-anchor="middle" fill="#F59E0B">result</text>
    <text class="s" x="832.0" y="142" text-anchor="middle">ledger · orders · events</text><text class="s" x="832.0" y="159" text-anchor="middle">+ trust report</text>
  </g>
  <g>
    <rect x="400" y="228" width="160" height="78" rx="12" fill="#0B1F24" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect class="lit" style="animation-delay:1.73s" x="400" y="228" width="160" height="78" rx="12" fill="#2DD4BF" fill-opacity="0.16" stroke="#2DD4BF" stroke-width="3"/>
    <text class="t" x="480.0" y="257" text-anchor="middle" fill="#2DD4BF">accounting</text>
    <text class="s" x="480.0" y="278" text-anchor="middle">multi-currency ledger</text><text class="s" x="480.0" y="295" text-anchor="middle">settlement · events</text>
  </g>
  <g>
    <rect x="580" y="228" width="186" height="78" rx="12" fill="#0B1F24" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect class="lit" style="animation-delay:1.73s" x="580" y="228" width="186" height="78" rx="12"
          fill="#2DD4BF" fill-opacity="0.16" stroke="#2DD4BF" stroke-width="3"/>
    <text class="t" x="673" y="257" text-anchor="middle" fill="#2DD4BF">markets</text>
    <rect x="594" y="270" width="80" height="24" rx="12" fill="#115E59"/>
    <text class="c" x="634" y="286" text-anchor="middle">tw_equity</text>
    <rect x="682" y="270" width="72" height="24" rx="12" fill="none" stroke="#64748B" stroke-dasharray="4 3"/>
    <text class="c" x="718" y="286" text-anchor="middle" fill="#94A3B8">crypto…</text>
  </g>
  <line x1="480" y1="228" x2="545" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#head)"/>
  <line class="lit" style="animation-delay:1.73s" x1="480" y1="228" x2="545" y2="176"
