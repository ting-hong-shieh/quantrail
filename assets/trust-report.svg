    <text x="22" y="378" fill="#CBD5E1" xml:space="preserve">  annual_volatility: 0.1608</text>
    <text x="22" y="399" fill="#CBD5E1" xml:space="preserve">  sharpe: 0.5940</text>
    <text x="22" y="420" fill="#CBD5E1" xml:space="preserve">  max_drawdown: -0.1223</text>
  </g>
</svg>
